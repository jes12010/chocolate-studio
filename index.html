<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chocolate Tasting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Chart.js and Annotation Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.0"></script>

  <!-- Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      background: #3b2f2f;
      color: #f7e7d3;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    h1, h2, h3, h4 {
      text-align: center;
      margin-top: 20px;
    }
    .container {
      width: 90%;
      margin: auto;
      max-width: 700px;
      padding-bottom: 40px;
    }
    .hidden { display: none; }

    #mouthfeelCloud {
      min-height: 100px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      justify-content: center;
      align-items: center;
    }

    /* LANDING PAGE BUTTONS */
    .landing-buttons button {
      width: 100%;
      padding: 20px;
      margin: 15px 0;
      font-size: 22px;
      background: #5a3e36;
      border: none;
      color: #f7e7d3;
      border-radius: 10px;
      cursor: pointer;
    }
    .landing-buttons button:hover {
      background: #d4a373;
      color: #3b2f2f;
    }

    /* SLIDERS */
    .slider-group { margin: 20px 0; }
    .slider-group label { display: block; margin-bottom: 5px; }

    /* DESCRIPTOR BUTTONS */
    .descriptor-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .descriptor-buttons button {
      margin: 4px;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      color: #3b2f2f;
      cursor: pointer;
      font-weight: bold;
    }
    .descriptor-buttons button.selected {
      outline: 3px solid #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
    }

    /* TABS & DATE SELECTOR */
    .tabs {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    .tabs button {
      margin: 0 10px;
      padding: 8px 16px;
      background: #5a3e36;
      border: none;
      color: #f7e7d3;
      border-radius: 6px;
      cursor: pointer;
    }
    .tabs button.active {
      background: #d4a373;
      color: #3b2f2f;
      font-weight: bold;
    }

    .date-selector-container {
      text-align: center;
      margin-top: 15px;
    }
    .date-selector-container select {
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 6px;
      background: #5a3e36;
      color: #f7e7d3;
      border: 1px solid #d4a373;
    }

    /* VISUALS BOX */
    .visual-box {
      background: #4a3a36;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-top: 15px;
      display: flex;
      flex-direction: column;
    }

    /* AROMA WORDS CONTAINER ABOVE PLOT */
    .aroma-words-container {
      display: flex;
      justify-content: space-between;
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 15px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
    }

    .word-column {
      flex: 1;
      text-align: center;
      padding: 0 5px;
    }

    .word-column h4 {
      margin: 0 0 5px 0;
      color: #f7e7d3;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .word-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
    }

    .aroma-chip {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    .canvas-wrapper {
      height: 320px;
      position: relative;
    }

    .aroma-stage-group {
      background: #4a3a36;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }
    .aroma-stage-group h4 {
      margin-top: 0;
      color: #d4a373;
    }

    /* NAV BUTTONS */
    .nav-btn {
      padding: 10px 20px;
      margin: 0 10px;
      background: #d4a373;
      border: none;
      color: #3b2f2f;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* SESSION MODAL */
    #sessionModal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #sessionCard {
      background: #4a332d;
      border: 2px solid #d4a373;
      padding: 30px;
      border-radius: 12px;
      width: 80%;
      max-width: 350px;
      text-align: center;
      color: #f7e7d3;
    }
    #sessionCard input {
      width: 90%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }
    #startSessionBtn {
      margin-top: 10px;
      padding: 10px 16px;
      background: #d4a373;
      border: none;
      color: #3b2f2f;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Chocolate Tasting</h1>

  <!-- STUDENT IDENTIFIER MODAL -->
  <div id="sessionModal">
    <div id="sessionCard">
      <h2>Student Identification</h2>

      <label style="display:block; text-align:left;">First Name</label>
      <input id="firstNameInput" type="text" placeholder="e.g. Jane" />

      <label style="display:block; text-align:left;">Last Name</label>
      <input id="lastNameInput" type="text" placeholder="e.g. Doe" />

      <label style="display:block; text-align:left;">Date</label>
      <input id="dateInput" type="text" readonly />

      <button id="startSessionBtn">Start Session</button>
    </div>
  </div>

  <!-- LANDING PAGE -->
  <div id="page-select" class="container">
    <h2>Select Your Chocolate</h2>
    <div class="landing-buttons">
      <button class="choc-btn" data-choc-id="choc1">Chocolate 1</button>
      <button class="choc-btn" data-choc-id="choc2">Chocolate 2</button>
      <button class="choc-btn" data-choc-id="choc3">Chocolate 3</button>
      <button class="choc-btn" data-choc-id="choc4">Chocolate 4</button>
    </div>
  </div>

  <!-- TASTING PAGE -->
  <div id="page-ratings" class="container hidden">
    <h2 id="choc-title"></h2>

    <div class="tabs">
      <button id="tab-my" class="active">My Ratings</button>
      <button id="tab-all">Everyone's Ratings</button>
    </div>

    <!-- DATE SELECTOR FOR PAST DATES (Visible in Everyone's Tab) -->
    <div id="dateSelectorContainer" class="date-selector-container hidden">
      <label for="historyDateSelect">Select Date: </label>
      <select id="historyDateSelect"></select>
    </div>

    <!-- BASIC TASTES -->
    <h3>Basic Tastes</h3>
    <div id="basic-sliders"></div>

    <div id="basic-plot-section" class="visual-box">
      <div class="canvas-wrapper">
        <canvas id="basicRadar"></canvas>
      </div>
    </div>

    <!-- MOUTHFEEL -->
    <h3>Mouthfeel</h3>
    <div id="mouthfeel-buttons" class="descriptor-buttons"></div>

    <div id="mouthfeel-cloud-section" class="visual-box">
      <div id="mouthfeelCloud"></div>
    </div>

    <!-- AROMAS SECTION -->
    <h3>Aromas Progression</h3>

    <!-- THREE SEQUENTIAL PROMPTS WITH DESCRIPTOR BUTTONS -->
    <div id="aroma-prompts-container">
      <div class="aroma-stage-group">
        <h4>1. What aromas are strongest initially?</h4>
        <div id="aroma-buttons-initial" class="descriptor-buttons"></div>
      </div>

      <div class="aroma-stage-group">
        <h4>2. What aromas are dominant in the middle?</h4>
        <div id="aroma-buttons-middle" class="descriptor-buttons"></div>
      </div>

      <div class="aroma-stage-group">
        <h4>3. What aromas linger at the end?</h4>
        <div id="aroma-buttons-finish" class="descriptor-buttons"></div>
      </div>
    </div>

    <!-- TIME-SERIES VISUALIZATION -->
    <div id="aroma-plot-section" class="visual-box">
      <!-- Dedicated scrollable header for word descriptors -->
      <div id="aromaWordsHeader" class="aroma-words-container">
        <div class="word-column" id="initialWordsCol">
          <h4>Initial</h4>
          <div class="word-list" id="initialWordsList"></div>
        </div>
        <div class="word-column" id="middleWordsCol">
          <h4>Middle</h4>
          <div class="word-list" id="middleWordsList"></div>
        </div>
        <div class="word-column" id="finishWordsCol">
          <h4>Finish</h4>
          <div class="word-list" id="finishWordsList"></div>
        </div>
      </div>

      <!-- Plot Canvas -->
      <div class="canvas-wrapper">
        <canvas id="aromaTimelineCanvas"></canvas>
      </div>
    </div>

    <!-- NAVIGATION BUTTONS -->
    <div id="nav-buttons" style="margin-top: 30px; text-align: center;">
      <button id="prevChocolate" class="nav-btn">Previous</button>
      <button id="nextChocolate" class="nav-btn">Next</button>
    </div>
  </div>

  <script>
    /***********************
     * CONFIG / CONSTANTS
     ***********************/
    const firebaseConfig = {
      apiKey: "AIzaSyAt_ZOV74tm7NqcorhvsrM4pmBus0siirA",
      authDomain: "chocolate-studio-83bd2.firebaseapp.com",
      databaseURL: "https://chocolate-studio-83bd2-default-rtdb.firebaseio.com",
      projectId: "chocolate-studio-83bd2",
      storageBucket: "chocolate-studio-83bd2.firebasestorage.app",
      messagingSenderId: "1038955602034",
      appId: "1:1038955602034:web:bdba0c0a9be2eb"
    };

    let firebaseEnabled = false;
    let db = null;

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      firebaseEnabled = true;
    } catch (e) {
      console.warn("Firebase init failed", e);
    }

    /***********************
     * USER & DATE LOGIC
     ***********************/
    let firstName = "";
    let lastName = "";
    let userID = "";
    let currentDate = new Date().toISOString().split("T")[0]; // YYYY-MM-DD
    let sessionID = currentDate; 
    let selectedHistoryDate = currentDate;

    document.getElementById("dateInput").value = currentDate;

    if (localStorage.getItem("tasterFirstName")) {
      document.getElementById("firstNameInput").value = localStorage.getItem("tasterFirstName");
    }
    if (localStorage.getItem("tasterLastName")) {
      document.getElementById("lastNameInput").value = localStorage.getItem("tasterLastName");
    }

    /***********************
     * CONSTANTS
     ***********************/
    const BASIC_TASTES = ["Sweet","Sour","Bitter","Salty","Umami"];

    const AROMA_DESCRIPTORS_BY_AXIS = {
      "Cocoa": ["Cocoa","Dark Chocolate","Cocoa Powder","Fermented"],
      "Fruity": ["Berry","Strawberry","Raspberry","Cherry","Blueberry","Blackberry","Cranberry","Citrus","Orange","Lemon","Lime","Stone Fruit","Peach","Plum","Apricot","Apple","Fig","Dried Fruit","Date","Raisin","Prune","Tropical Fruit","Mango","Banana","Passionfruit"],
      "Nutty & Toasted": ["Hazelnut","Almond","Peanut","Walnut","Macadamia","Pecan","Malt","Toast","Sweet Popcorn","Bran","Tortilla","Cereal/Grain","Coffee","Smoky","Burnt"],
      "Vegetal": ["Earthy","Herb-like","Green","Hay-like","Olive","Mushroom","Tobacco","Smoked Wood"],
      "Floral & Spices": ["Rose","Jasmine","Lavender","Chamomile","Cinnamon","Nutmeg","Clove","Pepper","Anise","Bergamot","Licorice"],
      "Sweet & Dairy": ["Vanilla","Coconut","Maple Syrup","Molasses","Honey","Caramel","Toffee","Burnt Sugar","Milk","Cream","Butter","Yogurt"]
    };

    const AROMA_COLORS = {
      "Cocoa": "#6a3d9a",
      "Fruity": "#d95f02",
      "Nutty & Toasted": "#a6761d",
      "Vegetal": "#1b9e77",
      "Floral & Spices": "#7570b3",
      "Sweet & Dairy": "#e6ab02"
    };

    const MOUTHFEEL_DESCRIPTORS = [
      "Creamy","Coarse","Soft","Melting","Sticky","Oily","Grainy",
      "Pungent","Astringent","Warm","Cool"
    ];

    /***********************
     * STATE
     ***********************/
    let currentChocolateId = null;
    let currentTab = "my";

    let myRatings = {
      basic: {},
      mouthfeel: new Set(),
      aromaStages: {
        initial: new Set(),
        middle: new Set(),
        finish: new Set()
      }
    };

    /***********************
     * DOM ELEMENTS
     ***********************/
    const pageSelect = document.getElementById("page-select");
    const pageRatings = document.getElementById("page-ratings");
    const chocTitle = document.getElementById("choc-title");

    const basicSlidersContainer = document.getElementById("basic-sliders");
    const mouthfeelButtonsContainer = document.getElementById("mouthfeel-buttons");
    const mouthfeelCloud = document.getElementById("mouthfeelCloud");

    const tabMy = document.getElementById("tab-my");
    const tabAll = document.getElementById("tab-all");
    const dateSelectorContainer = document.getElementById("dateSelectorContainer");
    const historyDateSelect = document.getElementById("historyDateSelect");

    /***********************
     * MODAL SUBMIT HANDLER
     ***********************/
    const startSessionBtn = document.getElementById("startSessionBtn");
    const firstNameInput = document.getElementById("firstNameInput");
    const lastNameInput = document.getElementById("lastNameInput");
    const sessionModal = document.getElementById("sessionModal");

    startSessionBtn.addEventListener("click", () => {
      const fName = firstNameInput.value.trim();
      const lName = lastNameInput.value.trim();

      if (!fName || !lName) {
        alert("Please enter both your first and last name.");
        return;
      }

      firstName = fName;
      lastName = lName;

      localStorage.setItem("tasterFirstName", firstName);
      localStorage.setItem("tasterLastName", lastName);

      userID = `${firstName}_${lastName}`.toLowerCase().replace(/[^a-z0-9_]/g, "");
      sessionModal.style.display = "none";
    });

    /***********************
     * CHARTS
     ***********************/
    let basicRadarChart = null;
    let aromaTimelineChart = null;

    function initCharts() {
      const basicCtx = document.getElementById("basicRadar").getContext("2d");
      const aromaCtx = document.getElementById("aromaTimelineCanvas").getContext("2d");

      if (basicRadarChart) basicRadarChart.destroy();
      if (aromaTimelineChart) aromaTimelineChart.destroy();

      basicRadarChart = new Chart(basicCtx, {
        type: "radar",
        data: {
          labels: BASIC_TASTES,
          datasets: [{
            label: "My Ratings",
            data: BASIC_TASTES.map(() => 0),
            backgroundColor: "rgba(255,215,128,0.2)",
            borderColor: "#ffd780",
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { r: { min: 0, max: 5, ticks: { stepSize: 1 } } },
          plugins: { legend: { display: false } }
        }
      });

      aromaTimelineChart = new Chart(aromaCtx, {
        type: "line",
        data: {
          labels: ["Initial", "Middle", "Finish"],
          datasets: []
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              min: 0,
              max: 3.5,
              title: { display: true, text: "Aroma Progression", color: "#f7e7d3" },
              ticks: { display: false },
              grid: { color: "rgba(255,255,255,0.1)" }
            },
            x: {
              ticks: { color: "#f7e7d3", font: { size: 14, weight: 'bold' } },
              grid: { color: "rgba(255,255,255,0.1)" }
            }
          },
          plugins: {
            legend: { labels: { color: "#f7e7d3" } }
          }
        }
      });
    }

    /***********************
     * RESET UI TO BLANK
     ***********************/
    function resetLocalRatings() {
      myRatings = {
        basic: {},
        mouthfeel: new Set(),
        aromaStages: {
          initial: new Set(),
          middle: new Set(),
          finish: new Set()
        }
      };

      document.querySelectorAll('input[data-type="basic"]').forEach(s => s.value = 0);
      document.querySelectorAll('#mouthfeel-buttons button').forEach(btn => btn.classList.remove("selected"));
      document.querySelectorAll('#aroma-prompts-container button').forEach(btn => btn.classList.remove("selected"));

      mouthfeelCloud.innerHTML = "";

      basicRadarChart.data.datasets[0].data = BASIC_TASTES.map(() => 0);
      basicRadarChart.update();

      updateAromaChart();
    }

    /***********************
     * UI BUILDERS
     ***********************/
    function buildBasicSliders() {
      basicSlidersContainer.innerHTML = "";
      BASIC_TASTES.forEach(taste => {
        const div = document.createElement("div");
        div.className = "slider-group";
        div.innerHTML = `
          <label>${taste}</label>
          <input type="range" min="0" max="5" value="0" data-type="basic" data-key="${taste}">
        `;
        basicSlidersContainer.appendChild(div);
      });
    }

    function buildMouthfeelButtons() {
      mouthfeelButtonsContainer.innerHTML = "";
      MOUTHFEEL_DESCRIPTORS.forEach(word => {
        const btn = document.createElement("button");
        btn.textContent = word;
        btn.dataset.word = word;
        btn.style.background = "#2ec4b6";
        btn.style.color = "#00332e";
        mouthfeelButtonsContainer.appendChild(btn);
      });
    }

    function buildAromaPromptButtons() {
      const stages = [
        { id: "initial", container: document.getElementById("aroma-buttons-initial") },
        { id: "middle", container: document.getElementById("aroma-buttons-middle") },
        { id: "finish", container: document.getElementById("aroma-buttons-finish") }
      ];

      stages.forEach(stage => {
        stage.container.innerHTML = "";
        Object.entries(AROMA_DESCRIPTORS_BY_AXIS).forEach(([axis, words]) => {
          const color = AROMA_COLORS[axis] || "#d4a373";
          words.forEach(word => {
            const btn = document.createElement("button");
            btn.textContent = word;
            btn.dataset.word = word;
            btn.dataset.stage = stage.id;
            btn.style.background = color;
            if (axis === "Cocoa") btn.style.color = "white";

            btn.addEventListener("click", () => handleAromaSelection(stage.id, word, btn));
            stage.container.appendChild(btn);
          });
        });
      });
    }

    /***********************
     * HELPER TO RENDER WORDS ABOVE PLOT
     ***********************/
    function renderAromaWordsAbovePlot(initialWords, middleWords, finishWords) {
      const findGroup = (word) => {
        const cleanWord = word.replace(/\s\(\d+\)$/, "");
        for (const [axis, words] of Object.entries(AROMA_DESCRIPTORS_BY_AXIS)) {
          if (words.includes(cleanWord)) return axis;
        }
        return null;
      };

      const populateColumn = (containerId, words) => {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        container.innerHTML = words.map(word => {
          const group = findGroup(word);
          const color = AROMA_COLORS[group] || "#d4a373";
          return `<span class="aroma-chip" style="background-color: ${color}33; color: ${color}; border: 1px solid ${color};">${word}</span>`;
        }).join("");
      };

      populateColumn("initialWordsList", initialWords);
      populateColumn("middleWordsList", middleWords);
      populateColumn("finishWordsList", finishWords);
    }

    /***********************
     * ATTACH LISTENERS
     ***********************/
    function attachSliderListeners() {
      document.querySelectorAll('input[data-type="basic"]').forEach(slider => {
        slider.addEventListener("input", () => {
          const key = slider.dataset.key;
          const value = Number(slider.value);
          myRatings.basic[key] = value;

          const idx = BASIC_TASTES.indexOf(key);
          basicRadarChart.data.datasets[0].data[idx] = value;
          basicRadarChart.update();

          updateFirebase();
        });
      });
    }

    function attachMouthfeelListeners() {
      document.querySelectorAll('#mouthfeel-buttons button').forEach(btn => {
        btn.addEventListener("click", () => {
          const word = btn.dataset.word;
          if (myRatings.mouthfeel.has(word)) {
            myRatings.mouthfeel.delete(word);
            btn.classList.remove("selected");
          } else {
            myRatings.mouthfeel.add(word);
            btn.classList.add("selected");
          }
          updateFirebase();
          updateClouds();
        });
      });
    }

    function handleAromaSelection(stage, word, button) {
      if (currentTab !== "my") return;

      const stageSet = myRatings.aromaStages[stage];
      if (stageSet.has(word)) {
        stageSet.delete(word);
        button.classList.remove("selected");
      } else {
        stageSet.add(word);
        button.classList.add("selected");
      }

      updateAromaChart();
      updateFirebase();
    }

    function updateAromaChart() {
      if (currentTab === "my") {
        const stages = ["initial", "middle", "finish"];
        const groupCounts = {};

        const findGroup = (word) => {
          const cleanWord = word.replace(/\s\(\d+\)$/, "");
          for (const [axis, words] of Object.entries(AROMA_DESCRIPTORS_BY_AXIS)) {
            if (words.includes(cleanWord)) return axis;
          }
          return null;
        };

        Object.keys(AROMA_DESCRIPTORS_BY_AXIS).forEach(group => {
          groupCounts[group] = [0, 0, 0];
        });

        stages.forEach((stage, stageIdx) => {
          myRatings.aromaStages[stage].forEach(word => {
            const group = findGroup(word);
            if (group) {
              groupCounts[group][stageIdx] += 1;
            }
          });
        });

        const datasets = [];
        Object.entries(groupCounts).forEach(([group, counts]) => {
          const totalSelections = counts.reduce((a, b) => a + b, 0);
          if (totalSelections > 0) {
            const color = AROMA_COLORS[group] || "#d4a373";
            const maxVal = Math.max(...counts, 1);
            const normalizedData = counts.map(val => (val / maxVal) * 3);

            datasets.push({
              label: group,
              data: normalizedData,
              borderColor: color,
              backgroundColor: color + "33",
              borderWidth: Math.min(2 + totalSelections * 0.5, 12),
              tension: 0.3,
              fill: false
            });
          }
        });

        const initialWords = Array.from(myRatings.aromaStages.initial);
        const middleWords = Array.from(myRatings.aromaStages.middle);
        const finishWords = Array.from(myRatings.aromaStages.finish);

        renderAromaWordsAbovePlot(initialWords, middleWords, finishWords);

        aromaTimelineChart.data.datasets = datasets;
        aromaTimelineChart.update();
      }
    }

    /***********************
     * RESTORE SAVED RATINGS
     ***********************/
    function loadMySavedRatings() {
      if (!firebaseEnabled || !sessionID || !currentChocolateId || !userID) return;

      db.ref(`ratings/${sessionID}/${currentChocolateId}/${userID}`).once("value", snapshot => {
        const data = snapshot.val();
        if (!data) return;

        BASIC_TASTES.forEach(taste => {
          const val = data.basic?.[taste] ?? 0;
          myRatings.basic[taste] = val;

          const slider = document.querySelector(`input[data-type="basic"][data-key="${taste}"]`);
          if (slider) slider.value = val;

          const idx = BASIC_TASTES.indexOf(taste);
          basicRadarChart.data.datasets[0].data[idx] = val;
        });
        basicRadarChart.update();

        myRatings.mouthfeel = new Set(data.mouthfeel || []);
        document.querySelectorAll('#mouthfeel-buttons button').forEach(btn => {
          const word = btn.dataset.word;
          if (myRatings.mouthfeel.has(word)) btn.classList.add("selected");
          else btn.classList.remove("selected");
        });

        if (data.aromaStages) {
          myRatings.aromaStages.initial = new Set(data.aromaStages.initial || []);
          myRatings.aromaStages.middle = new Set(data.aromaStages.middle || []);
          myRatings.aromaStages.finish = new Set(data.aromaStages.finish || []);

          document.querySelectorAll('#aroma-prompts-container button').forEach(btn => {
            const word = btn.dataset.word;
            const stage = btn.dataset.stage;
            if (myRatings.aromaStages[stage]?.has(word)) btn.classList.add("selected");
            else btn.classList.remove("selected");
          });
        }

        updateAromaChart();
        updateClouds();
      });
    }

    /***********************
     * LOAD CHOCOLATE
     ***********************/
    function loadChocolate(chocId) {
      currentChocolateId = chocId;

      const btn = document.querySelector(`.choc-btn[data-choc-id="${chocId}"]`);
      chocTitle.textContent = btn.textContent;

      pageSelect.classList.add("hidden");
      pageRatings.classList.remove("hidden");

      initCharts();
      buildBasicSliders();
      buildMouthfeelButtons();
      buildAromaPromptButtons();

      resetLocalRatings();

      attachSliderListeners();
      attachMouthfeelListeners();

      if (currentTab === "my") {
        loadMySavedRatings();
      } else {
        loadGroupRatings();
      }
    }

    document.querySelectorAll(".choc-btn").forEach(btn => {
      btn.addEventListener("click", () => loadChocolate(btn.dataset.chocId));
    });

    /***********************
     * HISTORY DATE SELECTOR
     ***********************/
    function populateDateDropdown() {
      if (!firebaseEnabled) return;

      db.ref("ratings").once("value", snapshot => {
        const datesObj = snapshot.val();
        historyDateSelect.innerHTML = "";

        if (!datesObj) {
          const opt = document.createElement("option");
          opt.value = currentDate;
          opt.textContent = currentDate;
          historyDateSelect.appendChild(opt);
          return;
        }

        const dates = Object.keys(datesObj).sort().reverse();
        dates.forEach(d => {
          const opt = document.createElement("option");
          opt.value = d;
          opt.textContent = d;
          if (d === selectedHistoryDate) opt.selected = true;
          historyDateSelect.appendChild(opt);
        });
      });
    }

    historyDateSelect.addEventListener("change", (e) => {
      selectedHistoryDate = e.target.value;
      loadGroupRatings();
    });

    /***********************
     * TAB SWITCHING
     ***********************/
    tabMy.addEventListener("click", () => {
      currentTab = "my";
      tabMy.classList.add("active");
      tabAll.classList.remove("active");
      dateSelectorContainer.classList.add("hidden");

      document.getElementById("basic-sliders").style.display = "block";
      document.getElementById("mouthfeel-buttons").style.display = "flex";
      document.getElementById("aroma-prompts-container").style.display = "block";

      basicRadarChart.data.datasets[0].label = "My Ratings";
      loadMySavedRatings();
    });

    tabAll.addEventListener("click", () => {
      currentTab = "all";
      tabMy.classList.remove("active");
      tabAll.classList.add("active");
      dateSelectorContainer.classList.remove("hidden");

      document.getElementById("basic-sliders").style.display = "none";
      document.getElementById("mouthfeel-buttons").style.display = "none";
      document.getElementById("aroma-prompts-container").style.display = "none";

      basicRadarChart.data.datasets[0].label = "Group Average";
      populateDateDropdown();
      loadGroupRatings();
    });

    /***********************
     * WORD CLOUDS (MY VIEW)
     ***********************/
    function updateClouds() {
      mouthfeelCloud.innerHTML = Array.from(myRatings.mouthfeel)
        .map(w => `<span style="font-size:18px;margin:4px;">${w}</span>`)
        .join("");
    }

    /***********************
     * REALTIME GROUP DATA
     ***********************/
    function loadGroupRatings() {
      if (!firebaseEnabled || !currentChocolateId) return;

      const targetDate = (currentTab === "all") ? selectedHistoryDate : sessionID;

      db.ref(`ratings/${targetDate}/${currentChocolateId}`).on("value", snapshot => {
        const all = snapshot.val();
        if (!all) return;

        const users = Object.values(all);

        const avgBasic = BASIC_TASTES.map(taste => {
          const vals = users.map(u => u.basic?.[taste] ?? 0);
          return vals.reduce((a,b)=>a+b,0) / (vals.length || 1);
        });

        const mouthfeelFreq = {};
        users.forEach(u => {
          (u.mouthfeel || []).forEach(w => mouthfeelFreq[w] = (mouthfeelFreq[w]||0)+1);
        });

        if (currentTab === "all") {
          basicRadarChart.data.datasets[0].data = avgBasic;
          basicRadarChart.update();

          const maxM = Math.max(...Object.values(mouthfeelFreq), 1);
          mouthfeelCloud.innerHTML = Object.entries(mouthfeelFreq)
            .map(([word, count]) => {
              const size = 14 + (count / maxM) * 26;
              return `<span style="font-size:${size}px;margin:4px;">${word} (${count})</span>`;
            }).join("");

          const findGroup = (word) => {
            const cleanWord = word.replace(/\s\(\d+\)$/, "");
            for (const [axis, words] of Object.entries(AROMA_DESCRIPTORS_BY_AXIS)) {
              if (words.includes(cleanWord)) return axis;
            }
            return null;
          };

          const groupCounts = {};
          Object.keys(AROMA_DESCRIPTORS_BY_AXIS).forEach(group => {
            groupCounts[group] = [0, 0, 0];
          });

          const counts = { initial: {}, middle: {}, finish: {} };

          users.forEach(u => {
            ["initial", "middle", "finish"].forEach((stage, stageIdx) => {
              const words = u.aromaStages?.[stage] || [];
              words.forEach(w => {
                counts[stage][w] = (counts[stage][w] || 0) + 1;
                const grp = findGroup(w);
                if (grp) {
                  groupCounts[grp][stageIdx] += 1;
                }
              });
            });
          });

          const datasets = [];
          Object.entries(groupCounts).forEach(([group, stageTotals]) => {
            const totalSelections = stageTotals.reduce((a, b) => a + b, 0);
            if (totalSelections > 0) {
              const color = AROMA_COLORS[group] || "#d4a373";
              const maxVal = Math.max(...stageTotals, 1);
              const normalizedData = stageTotals.map(val => (val / maxVal) * 3);

              datasets.push({
                label: group,
                data: normalizedData,
                borderColor: color,
                backgroundColor: color + "33",
                borderWidth: Math.min(2 + totalSelections * 0.5, 12),
                tension: 0.3,
                fill: false
              });
            }
          });

          const formatGroupWords = (stageObj) => {
            return Object.entries(stageObj)
              .sort((a, b) => b[1] - a[1])
              .map(([word, count]) => `${word} (${count})`);
          };

          const initTop = formatGroupWords(counts.initial);
          const midTop = formatGroupWords(counts.middle);
          const finTop = formatGroupWords(counts.finish);

          renderAromaWordsAbovePlot(initTop, midTop, finTop);

          aromaTimelineChart.data.datasets = datasets;
          aromaTimelineChart.update();
        }
      });
    }

    /***********************
     * FIREBASE SYNC
     ***********************/
    function updateFirebase() {
      if (!firebaseEnabled || !sessionID || !currentChocolateId || !userID) return;

      db.ref(`ratings/${sessionID}/${currentChocolateId}/${userID}`).set({
        studentInfo: {
          firstName: firstName,
          lastName: lastName,
          date: currentDate,
          timestamp: Date.now()
        },
        basic: Object.fromEntries(Object.entries(myRatings.basic)),
        mouthfeel: Array.from(myRatings.mouthfeel),
        aromaStages: {
          initial: Array.from(myRatings.aromaStages.initial),
          middle: Array.from(myRatings.aromaStages.middle),
          finish: Array.from(myRatings.aromaStages.finish)
        }
      });
    }

    /***********************
     * NAVIGATION BUTTONS
     ***********************/
    const chocolates = ["choc1","choc2","choc3","choc4"];

    document.getElementById("nextChocolate").addEventListener("click", () => {
      const idx = chocolates.indexOf(currentChocolateId);
      const next = chocolates[(idx + 1) % chocolates.length];
      loadChocolate(next);
    });

    document.getElementById("prevChocolate").addEventListener("click", () => {
      const idx = chocolates.indexOf(currentChocolateId);
      const prev = chocolates[(idx - 1 + chocolates.length) % chocolates.length];
      loadChocolate(prev);
    });
  </script>
</body>
</html>
